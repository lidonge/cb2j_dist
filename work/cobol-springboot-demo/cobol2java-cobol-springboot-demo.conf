application {
  name = "cobol2java"
  version = "1.0"
  dirs {
    sourcePath = "/home/lidong/cb2j_cics/cobol2java/convertor/src/main/COBOL/boc"
    targetPath = "../generated-sources/cobol2java/src/main/java"
    copyDir = "copybook"
    extraCopyDirs = [
      "/home/lidong/cb2j_cics/cobol2java/convertor/src/main/COBOL/boc/*"
    ]
  }
  rootPackageName = "boc.java"
  format = "FIXED"
  encoding = "GB18030"
  copybookManage = true
  copySourceFilesToTarget = true
  outputProcessDocs = true
  useCopyCast = true
  suffixes = ";.COB;.cbl;.sqb;.c;.cpy;.jcl"
  compileFiles = "SOURCE*/*"
  formatter {
    googleJavaFormat = false
  }
  debug {
    all = true
  }
  parallel {
    cbl = true
    copybook = true
    subCbl = true
    procedure {
        enabled = true
        minCblLines = 600
        chunkLines = 200
        # 0 means use available processors, capped by chunk count.
        threads = 0
    }    
  }
  cics.vsam {
    generateArtifacts = true
    packageName = "boc.java.vsam"
  }
  sql.mybatis {
    process = true
    generateArtifacts = true
    packageName = "boc.java.mybatis"
  }
  typeReplacements {}
}
